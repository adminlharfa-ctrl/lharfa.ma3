<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="register_page_title">إنشاء حساب جديد | lharfa.ma</title>
    <link rel="icon" type="image/jpeg" href="logo1.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@0.344.0"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="translations.js"></script>
    <script src="i18n-manager.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="api.js" defer></script>
    <script src="navbar.js" defer></script>
    <style>
        body {
            background: var(--primary-black);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
            font-family: 'Tajawal', sans-serif;
        }

        /* Dynamic Background Glows */
        .auth-bg-glow-1 {
            position: fixed;
            top: -10%;
            right: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, var(--primary-red-glow) 0%, transparent 70%);
            filter: blur(100px);
            z-index: -1;
            animation: pulse-glow 10s infinite alternate;
        }

        .auth-bg-glow-2 {
            position: fixed;
            bottom: -10%;
            left: -10%;
            width: 40vw;
            height: 40vw;
            background: radial-gradient(circle, rgba(255, 63, 0, 0.1) 0%, transparent 70%);
            filter: blur(80px);
            z-index: -1;
            animation: pulse-glow 8s infinite alternate-reverse;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.5; }
            100% { transform: scale(1.2) translate(5%, 5%); opacity: 0.8; }
        }

        .auth-page-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 20px;
            position: relative;
            z-index: 10;
        }

        .premium-auth-card {
            background: rgba(5, 7, 10, 0.6);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 40px;
            padding: 60px;
            width: 100%;
            max-width: 780px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            position: relative;
            animation: cardAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .premium-auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary-red), transparent);
            opacity: 0.5;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 45px;
        }

        .auth-logo {
            display: inline-block;
            margin-bottom: 25px;
            font-size: 32px;
            font-weight: 950;
            color: white;
            text-decoration: none;
            
        }

        .auth-title {
            font-size: 32px;
            font-weight: 950;
            margin-bottom: 12px;
            color: white;
            
        }

        .auth-subtitle {
            font-size: 15px;
            color: #94A3B8;
            font-weight: 700;
        }

        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        .role-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: #94A3B8;
        }

        .role-card i {
            font-size: 32px;
            transition: 0.3s;
        }

        .role-card span {
            font-weight: 950;
            font-size: 17px;
        }

        .role-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.15);
            color: white;
            transform: translateY(-5px);
        }

        .role-card.active {
            background: rgba(255, 63, 0, 0.1);
            border-color: var(--primary-red);
            color: white;
            box-shadow: 0 10px 25px rgba(255, 63, 0, 0.15);
        }

        .role-card.active i {
            color: var(--primary-red);
            transform: scale(1.1);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .premium-form-group {
            margin-bottom: 25px;
        }

        .premium-form-group label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: 800;
            color: #CBD5E1;
        }

        .premium-form-group label i {
            color: var(--primary-red);
            width: 18px;
            height: 18px;
        }

        .premium-input-box {
            position: relative;
        }

        .premium-input-box input,
        .premium-input-box select {
            width: 100%;
            height: 60px;
            padding: 0 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            font-size: 15px;
            font-weight: 700;
            color: white;
            transition: all 0.3s ease;
            outline: none;
            color-scheme: dark;
        }

        .premium-input-box select option {
            background: #0F172A;
            color: white;
        }

        .premium-input-box input:focus,
        .premium-input-box select:focus {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--primary-red);
            box-shadow: 0 0 0 4px rgba(255, 63, 0, 0.15);
        }

        .eye-btn {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #64748B;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            z-index: 5;
        }

        [dir="rtl"] .eye-btn {
            left: 15px;
            right: auto;
        }

        .strength-meter {
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-top: 12px;
            overflow: hidden;
            display: flex;
            gap: 4px;
        }

        .strength-segment {
            flex: 1;
            height: 100%;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.4s ease;
        }

        .register-submit-btn {
            width: 100%;
            height: 64px;
            background: var(--grad-red);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 17px;
            font-weight: 950;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(255, 63, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }

        .register-submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 63, 0, 0.4);
            filter: brightness(1.1);
        }

        .text-red {
            color: var(--primary-red) !important;
            text-decoration: none;
            transition: 0.3s;
        }

        .text-red:hover {
            filter: brightness(1.2);
            text-decoration: underline;
        }

        .custom-checkbox {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            user-select: none;
        }

        .custom-checkbox input {
            display: none;
        }

        .checkmark {
            width: 22px;
            height: 22px;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .custom-checkbox input:checked + .checkmark {
            background: var(--primary-red);
            border-color: var(--primary-red);
        }

        .checkmark i {
            color: white;
            font-size: 14px;
            opacity: 0;
            transform: scale(0.5);
            transition: 0.3s;
        }

        .custom-checkbox input:checked + .checkmark i {
            opacity: 1;
            transform: scale(1);
        }

        .footer-links-box {
            text-align: center;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .auth-logo img {
            height: 40px !important;
            width: auto !important;
            object-fit: contain;
        }

        @media (max-width: 768px) {
            .auth-logo {
                font-size: 28px !important;
                gap: 8px !important;
            }

            .auth-logo img {
                height: 35px !important;
            }
            .premium-auth-card {
                padding: 40px 25px;
                border-radius: 30px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .auth-title {
                font-size: 26px;
            }

            .auth-page-wrapper {
                padding: 40px 15px;
            }

            .role-selector {
                grid-template-columns: 1fr;
            }

            .register-submit-btn {
                height: 60px;
            }
        }
    </style>
    <script src="footer.js" defer></script>
    <link rel="stylesheet" href="mobile.css">
</head>

<body>
    <div class="auth-bg-glow-1"></div>
    <div class="auth-bg-glow-2"></div>

    <nav class="navbar"></nav>
    
    <div class="auth-page-wrapper">
        <div class="premium-auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-logo" style="color: var(--primary-red); display: inline-flex; align-items: center; justify-content: center; gap: 12px; direction: ltr;">
                    <img src="logo1.png" alt="lharfa.ma Logo" style="height: 40px; width: auto; border-radius: 8px;">
                    <span>lharfa<span style="color: white;">.ma</span></span>
                </a>
                <h1 class="auth-title" data-i18n="create_account_title">إنشاء حساب جديد</h1>
                <p class="auth-subtitle" data-i18n="create_account_subtitle">انضم إلى مجتمع lharfa.ma في دقيقة واحدة</p>
            </div>

            <!-- Role Selector -->
            <div class="role-selector">
                <div class="role-card active" id="roleClient" onclick="selectRole('client')">
                    <i data-lucide="user"></i>
                    <span data-i18n="client">أنا زبون</span>
                </div>
                <div class="role-card" id="roleArtisan" onclick="selectRole('artisan')">
                    <i data-lucide="wrench"></i>
                    <span data-i18n="artisan">أنا حرفي</span>
                </div>
            </div>

            <div class="alert-error" id="registerError" style="background:rgba(239, 68, 68, 0.1); color:#FCA5A5; padding:18px; border-radius:18px; margin-bottom:30px; display:none; align-items:center; gap:12px; font-weight:800; border:1px solid rgba(239, 68, 68, 0.2);">
                <i data-lucide="alert-circle"></i> <span id="regErrorMsg"></span>
            </div>
            <div id="registerSuccess" role="status" style="background:rgba(16, 185, 129, 0.1); color:#6EE7B7; padding:18px; border-radius:18px; margin-bottom:30px; display:none; align-items:center; gap:12px; font-weight:800; border:1px solid rgba(16, 185, 129, 0.2);">
                <i data-lucide="check-circle"></i> <span id="regSuccessMsg"></span>
            </div>

            <form id="registerForm">
                <input type="hidden" id="selectedRole" value="client">

                <div class="form-grid">
                    <div class="premium-form-group">
                        <label><i data-lucide="user"></i> <span data-i18n="full_name">الاسم الكامل</span></label>
                        <div class="premium-input-box">
                            <input type="text" id="regName" placeholder="مثال: أحمد العمراني" required autocomplete="name">
                        </div>
                    </div>
                    <div class="premium-form-group">
                        <label><i data-lucide="phone"></i> <span data-i18n="phone_number">رقم الهاتف</span></label>
                        <div class="premium-input-box">
                            <input type="tel" id="regPhone" placeholder="06XXXXXXXX" required autocomplete="tel">
                        </div>
                    </div>
                </div>

                <div class="premium-form-group">
                    <label><i data-lucide="mail"></i> <span data-i18n="email">البريد الإلكتروني</span></label>
                    <div class="premium-input-box">
                        <input type="email" id="regEmail" placeholder="example@mail.com" required autocomplete="email">
                    </div>
                </div>

                <div class="form-grid" id="geoGrid">
                    <div class="premium-form-group" id="specialtyField" style="display: none;">
                        <label><i data-lucide="wrench"></i> <span data-i18n="professional_specialty">التخصص المهني</span></label>
                        <div class="premium-input-box">
                            <select id="regSpecialty">
                                <option value="" data-i18n="choose_specialty">اختر تخصصك</option>
                                <option value="electricity" data-i18n="electricity">الكهرباء</option>
                                <option value="plumbing" data-i18n="plumbing">السباكة</option>
                                <option value="carpentry" data-i18n="carpentry">النجارة</option>
                                <option value="painting" data-i18n="painting">الصباغة</option>
                                <option value="masonry" data-i18n="masonry">البناء</option>
                                <option value="ac" data-i18n="ac">التكييف</option>
                                <option value="aluminum" data-i18n="aluminum">الألمنيوم</option>
                                <option value="cleaning" data-i18n="cleaning">التنظيف</option>
                                <option value="appliances" data-i18n="appliances">إلكترومنزلي</option>
                                <option value="transport" data-i18n="transport">النقل</option>
                            </select>
                        </div>
                    </div>
                    <div class="premium-form-group" id="cityContainer" style="grid-column: span 2;">
                        <label><i data-lucide="map-pin"></i> <span data-i18n="city">المدينة</span></label>
                        <div class="premium-input-box">
                            <select id="regCity" required>
                                <option value="" data-i18n="choose_city">اختر مدينتك</option>
                                <option value="taroudant" data-i18n="taroudant">تارودانت</option>
                                <option value="agadir" data-i18n="agadir">أكادير</option>
                                <option value="marrakech" data-i18n="marrakech">مراكش</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="premium-form-group">
                    <label><i data-lucide="lock"></i> <span data-i18n="password">كلمة المرور</span></label>
                    <div class="premium-input-box">
                        <input type="password" id="regPassword" placeholder="••••••••" required minlength="8" autocomplete="new-password" oninput="checkStrength(this.value)">
                        <button type="button" class="eye-btn" onclick="togglePass('regPassword', this)">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                    <div class="strength-meter">
                        <div class="strength-segment"></div>
                        <div class="strength-segment"></div>
                        <div class="strength-segment"></div>
                        <div class="strength-segment"></div>
                    </div>
                </div>

                <div style="margin: 30px 0;">
                    <label class="custom-checkbox">
                        <input type="checkbox" id="terms" required>
                        <span class="checkmark"><i data-lucide="check"></i></span>
                        <span style="font-size:14px; color:#94A3B8; cursor:pointer; font-weight:700;">
                            <span data-i18n="i_agree">أوافق على</span> <a href="terms.html" class="text-red" style="text-decoration: underline;">الشروط والأحكام</a>
                        </span>
                    </label>
                </div>

                <button type="submit" class="register-submit-btn" id="registerBtn">
                    <span data-i18n="create_account_btn">إنشاء الحساب</span> <i data-lucide="user-plus"></i>
                </button>
            </form>

            <div class="footer-links-box">
                <p style="font-size: 16px; color: #94A3B8; font-weight: 700;">
                    <span data-i18n="have_account">لديك حساب بالفعل؟</span> 
                    <a href="login.html" class="text-red" style="font-weight:950; margin-right: 8px;" data-i18n="login_now">تسجيل الدخول</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Footer Container -->
    <div class="footer-container"></div>

    <script>
        function selectRole(role) {
            document.getElementById('selectedRole').value = role;
            document.getElementById('roleClient').classList.toggle('active', role === 'client');
            document.getElementById('roleArtisan').classList.toggle('active', role === 'artisan');
            
            const specField = document.getElementById('specialtyField');
            const cityCont = document.getElementById('cityContainer');
            
            if (role === 'artisan') {
                specField.style.display = 'block';
                cityCont.style.gridColumn = 'span 1';
            } else {
                specField.style.display = 'none';
                cityCont.style.gridColumn = 'span 2';
            }
            
            if (window.lucide) lucide.createIcons();
        }

        function togglePass(id, btn) {
            const inp = document.getElementById(id);
            const icon = btn.querySelector('i');
            if (inp.type === 'password') {
                inp.type = 'text';
                icon.dataset.lucide = 'eye-off';
            } else {
                inp.type = 'password';
                icon.dataset.lucide = 'eye';
            }
            if (window.lucide) lucide.createIcons();
        }

        function checkStrength(val) {
            const segments = document.querySelectorAll('.strength-segment');
            let score = 0;
            if (val.length >= 6) score++;
            if (val.length >= 10) score++;
            if (/[A-Z]/.test(val) || /[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            const colors = ['#EF4444', '#F59E0B', '#3B82F6', '#10B981'];
            
            segments.forEach((seg, index) => {
                if (index < score) {
                    seg.style.background = colors[score - 1];
                } else {
                    seg.style.background = 'rgba(255,255,255,0.05)';
                }
            });
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('registerBtn');
            const errBox = document.getElementById('registerError');
            const errMsg = document.getElementById('regErrorMsg');
            const successBox = document.getElementById('registerSuccess');

            errBox.style.display = 'none';
            successBox.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader" style="animation: spin 1s linear infinite;"></i> <span data-i18n="loading">جاري إنشاء الحساب...</span>`;
            if (window.lucide) lucide.createIcons();

            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value;
            const role = document.getElementById('selectedRole').value;
            const specialty = document.getElementById('regSpecialty')?.value;
            const city = document.getElementById('regCity')?.value;

            try {
                if (!window.api || typeof window.api.register !== 'function') {
                    throw new Error('تعذر تحميل واجهة الموقع. أعد تحميل الصفحة وحاول مرة أخرى.');
                }

                const data = await window.api.register({ name, email, phone, password, role, specialty, city });
                if (data.success) {
                    if (data.confirmationRequired) {
                        document.getElementById('regSuccessMsg').textContent = 'تم إنشاء الحساب. تحقق من بريدك الإلكتروني لتأكيده، ثم سجل الدخول.';
                        successBox.style.display = 'flex';
                        btn.disabled = false;
                        btn.innerHTML = `<span data-i18n="create_account_btn">إنشاء الحساب</span> <i data-lucide="user-plus"></i>`;
                        if (window.lucide) lucide.createIcons();
                        return;
                    }
                    const role = data.user?.role || 'client';
                    window.location.href = role === 'artisan' ? 'artisan-dashboard.html' : (role === 'admin' ? 'admin-dashboard.html' : 'client-dashboard.html');
                    return;
                }

                throw new Error(data.message || 'تعذر إنشاء الحساب. حاول مرة أخرى.');
            } catch (err) {
                errMsg.textContent = err.message;
                errBox.style.display = 'flex';
                btn.disabled = false;
                btn.innerHTML = `<span data-i18n="create_account_btn">إنشاء الحساب</span> <i data-lucide="user-plus"></i>`;
                if (window.lucide) lucide.createIcons();
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            if (window.I18nManager) I18nManager.updateDOM();
            if (window.lucide) lucide.createIcons();
        });
    </script>
    <script src="platform-actions.js"></script>
</body>
</html>
