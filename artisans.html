<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

        rel="stylesheet">

    <script src="navbar.js" defer></script>
    <script src="footer.js" defer></script>
    <style>
        /* ELITE DISCOVERY HUB DESIGN SYSTEM */
        :root {
            --discovery-bg: #F8FAFC;
        }

        .discovery-root {
            background: var(--discovery-bg);
            min-height: 100vh;
        }

        /* Hero Header with Animated Glows */
        .discovery-header {
            background: #05070A;
            padding: 120px 0 160px;
            color: white;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .discovery-header .header-glow-1 {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 40%;
            height: 60%;
            background: radial-gradient(circle, var(--primary-red-glow) 0%, transparent 70%);
            filter: blur(80px);
            opacity: 0.6;
        }

        .discovery-header .header-glow-2 {
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 30%;
            height: 50%;
            background: radial-gradient(circle, rgba(255, 63, 0, 0.15) 0%, transparent 70%);
            filter: blur(80px);
            opacity: 0.4;
        }

        /* Filter Dock - Modern Floating Panel */
        .filter-dock-wrapper {
            margin-top: -80px;
            position: relative;
            z-index: 9999; /* Higher z-index for the entire dock */
            padding: 0 20px;
            overflow: visible !important;
        }

        .filter-dock {
            background: white;
            border-radius: 35px;
            padding: 40px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.1);
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr auto;
            gap: 25px;
            align-items: flex-end;
            transition: var(--transition-base);
            position: relative;
            overflow: visible !important; /* Allow menus to overflow the dock */
            z-index: 10000;
        }

        .filter-dock:hover {
            transform: translateY(-5px);
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.12);
        }

        .dock-label {
            font-size: 13px;
            font-weight: 900;
            color: #64748B;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            
        }

        .dock-label i {
            color: var(--primary-red);
            width: 16px;
        }

        .filter-input-elite {
            width: 100%;
            height: 60px;
            background: #F1F5F9;
            border: 2px solid transparent;
            border-radius: 18px;
            padding: 0 20px;
            font-size: 16px;
            font-weight: 800;
            color: #1E293B;
            transition: 0.3s;
            outline: none;
        }

        .filter-input-elite:focus {
            background: white;
            border-color: var(--primary-red);
            box-shadow: 0 0 0 4px var(--primary-red-glow);
        }

        /* Custom Elite Dropdown Styles */
        .elite-dropdown {
            position: relative;
            cursor: pointer;
            width: 100%;
        }

        .elite-dropdown-trigger {
            width: 100%;
            height: 70px;
            background: white;
            border: 2px solid #F1F5F9;
            border-radius: 25px;
            padding: 0 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        .elite-dropdown:hover .elite-dropdown-trigger {
            border-color: var(--primary-red-glow);
            transform: translateY(-2px);
        }

        .elite-dropdown.active .elite-dropdown-trigger {
            background: white;
            border-color: var(--primary-red);
            box-shadow: 0 10px 30px rgba(255, 63, 0, 0.1);
        }

        .selected-label {
            font-size: 16px;
            font-weight: 800;
            color: #1E293B;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .selected-label i {
            color: var(--primary-red);
            width: 20px;
        }

        .elite-dropdown-menu {
            position: absolute;
            top: calc(100% + 15px);
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.18);
            border: 1px solid rgba(0,0,0,0.08);
            padding: 12px;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px) scale(0.95);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 400px;
            overflow-y: auto;
        }

        .elite-dropdown.active .elite-dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .elite-dropdown-option {
            padding: 15px 20px;
            border-radius: 18px;
            font-weight: 800;
            color: #475569;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 5px;
        }

        .elite-dropdown-option i {
            width: 20px;
            color: #94A3B8;
            transition: 0.3s;
        }

        .elite-dropdown-option:hover {
            background: #FFF5F2;
            color: var(--primary-red);
            transform: translateX(-5px);
        }

        .elite-dropdown-option:hover i {
            color: var(--primary-red);
            transform: scale(1.2);
        }

        .elite-dropdown-option.active {
            background: var(--grad-red);
            color: white;
        }

        .elite-dropdown-option.active i {
            color: white;
        }

        /* Artisan Card V6 - Next Gen Elite */
        .artisan-card-elite {
            background: white;
            border-radius: 48px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            padding: 40px;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            gap: 30px;
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            animation: cardReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes cardReveal {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .artisan-card-elite:hover {
            transform: translateY(-15px);
            border-color: var(--primary-red);
            box-shadow: 0 40px 100px rgba(255, 63, 0, 0.1);
        }

        /* Premium Floating Badges */
        .card-badge-verified {
            position: absolute;
            top: 30px;
            right: 30px; /* Adjusted for RTL */
            background: #F0FDF4;
            color: #16A34A;
            padding: 8px 18px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 950;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 10;
            border: 1.5px solid #DCFCE7;
        }

        .card-badge-elite {
            position: absolute;
            top: 30px;
            left: 30px; /* Adjusted for RTL */
            background: linear-gradient(135deg, #FFD700 0%, #B8860B 100%);
            color: white;
            padding: 8px 18px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 950;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 10px 25px rgba(184, 134, 11, 0.3);
            z-index: 10;
        }

        .card-profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 20px;
            margin-top: 20px;
        }

        .card-avatar-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
        }

        .card-avatar-v3 {
            width: 100%;
            height: 100%;
            border-radius: 45px;
            object-fit: cover;
            border: 6px solid white;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .artisan-card-elite:hover .card-avatar-v3 {
            transform: scale(1.1) rotate(5deg);
            border-color: var(--primary-red-glow);
        }

        .online-dot {
            position: absolute;
            bottom: 5px;
            left: 5px; /* RTL fix */
            width: 25px;
            height: 25px;
            background: #10B981;
            border: 5px solid white;
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
            animation: pulse-online 2s infinite;
        }

        .card-name-v3 h3 {
            font-size: 26px;
            font-weight: 950;
            color: #0F172A;
            
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .card-star-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #FFFBEB;
            padding: 8px 20px;
            border-radius: 100px;
            font-weight: 950;
            font-size: 15px;
            color: #D97706;
            border: 1.5px solid #FEF3C7;
        }

        .card-tag-cloud {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .tag-v3 {
            background: #F8FAFC;
            color: #475569;
            padding: 12px 22px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1.5px solid #F1F5F9;
            transition: 0.3s;
        }

        .artisan-card-elite:hover .tag-v3 {
            background: white;
            border-color: var(--primary-red);
            color: var(--primary-red);
        }

        .card-bio-v3 {
            font-size: 16px;
            line-height: 1.8;
            font-weight: 700;
            color: #64748B;
            text-align: center;
            margin: 10px 0;
            height: 58px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .card-metrics-v3 {
            background: #F9FAFB;
            border-radius: 32px;
            padding: 25px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            text-align: center;
            border: 1.5px solid #F3F4F6;
            transition: 0.3s;
        }

        .artisan-card-elite:hover .card-metrics-v3 {
            background: white;
            border-color: #FEE2E2;
            transform: scale(1.02);
        }

        .metric-v3:first-child {
            border-inline-end: 2px solid #E2E8F0;
        }

        .m-val {
            font-size: 22px;
            font-weight: 950;
            color: #0F172A;
            display: block;
        }

        .m-lab {
            font-size: 12px;
            font-weight: 900;
            color: #94A3B8;
            text-transform: uppercase;
            
        }

        .card-btn-group {
            display: grid;
            grid-template-columns: 1.8fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }

        .btn-elite-v4 {
            height: 65px;
            border-radius: 24px;
            font-weight: 950;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            border: none;
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .btn-book-now {
            background: var(--grad-red);
            color: white;
            box-shadow: 0 15px 35px rgba(255, 63, 0, 0.25);
        }

        .btn-book-now::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: translateX(-100%);
            transition: 0.6s;
        }

        .btn-book-now:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 20px 40px rgba(255, 63, 0, 0.35);
        }

        .btn-book-now:hover::after {
            transform: translateX(100%);
        }

        .btn-view-profile {
            background: #F8FAFC;
            color: #475569;
            border: 1.5px solid #E2E8F0;
        }

        .btn-view-profile:hover {
            background: white;
            border-color: var(--primary-red);
            color: var(--primary-red);
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.05);
        }

        .btn-elite-v4 i {
            width: 18px;
            transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-book-now:hover i {
            transform: translateX(-5px) scale(1.2);
        }

        /* Skeleton Loading */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 10px;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
        }

        /* Booking Modal Styles */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            z-index: 20000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content-elite {
            background: white;
            width: 100%;
            max-width: 550px;
            border-radius: 40px;
            padding: 40px;
            position: relative;
            transform: translateY(30px) scale(0.95);
            transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 40px 100px rgba(0,0,0,0.3);
        }

        .modal-overlay.active .modal-content-elite {
            transform: translateY(0) scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
        }

        .close-modal-btn {
            background: #F1F5F9;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            color: #64748B;
        }

        .close-modal-btn:hover {
            background: #FEE2E2;
            color: var(--primary-red);
            transform: rotate(90deg);
        }

        .form-group-elite {
            margin-bottom: 25px;
        }

        .modal-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 800;
            color: #1E293B;
            margin-bottom: 12px;
        }

        .modal-label i {
            color: var(--primary-red);
            width: 18px;
        }

        .modal-input {
            width: 100%;
            height: 60px;
            background: #F8FAFC;
            border: 2px solid #F1F5F9;
            border-radius: 20px;
            padding: 0 20px;
            font-size: 16px;
            font-weight: 700;
            color: #0F172A;
            transition: 0.3s;
            outline: none;
        }

        .modal-input:focus {
            background: white;
            border-color: var(--primary-red);
            box-shadow: 0 0 0 4px var(--primary-red-glow);
        }

        /* Responsive Fixes */
        @media (max-width: 1200px) {
            .filter-dock { grid-template-columns: 1fr 1fr; }
        }

        @media (max-width: 768px) {
            .filter-dock { grid-template-columns: 1fr; border-radius: 30px; padding: 25px; }
            .artisan-grid-v3 { grid-template-columns: 1fr !important; }
            .card-btn-group { grid-template-columns: 1fr; }
            .discovery-header { padding: 100px 0 120px; }
            .discovery-header h1 { font-size: 36px !important; }
        }
    </style>
    <link rel="stylesheet" href="mobile.css">
</head>

<body class="discovery-root">
    <nav class="navbar"></nav>

    <header class="discovery-header">
        <div class="header-glow-1"></div>
        <div class="header-glow-2"></div>
        <div class="container" style="position: relative; z-index: 10;">
            <div class="hero-badge" style="background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 8px 20px; border-radius: 100px; display: inline-flex; align-items: center; gap: 10px; font-weight: 900; font-size: 13px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1);">
                <i data-lucide="sparkles" style="width: 16px; color: var(--primary-red);"></i> 
                <span>دليل الحرفيين</span>
            </div>
            <h1 style="font-size: 56px; font-weight: 950; margin-bottom: 20px; " data-i18n="discover_pros">اكتشف أفضل المحترفين</h1>
            <p style="font-size: 20px; font-weight: 700; opacity: 0.8; max-width: 700px; margin: 0 auto; line-height: 1.6;"
                >اختر التخصص والمدينة للعثور على الخدمة المناسبة.</p>
        </div>
    </header>

        <div class="filter-dock">
            <div class="filter-col">
                <label class="dock-label"><i data-lucide="search"></i> <span data-i18n="search_smart">البحث الذكي</span></label>
                <input type="text" id="qSearch" class="filter-input-elite" 
                    placeholder="اسم الحرفي أو الخدمة..." onkeyup="handleFilter()">
            </div>
            <div class="filter-col">
                <label class="dock-label"><i data-lucide="wrench"></i> <span data-i18n="category">التخصص</span></label>
                <div class="elite-dropdown" id="catDropdown">
                    <div class="elite-dropdown-trigger">
                        <div class="selected-label" data-i18n="all_specialties"><i data-lucide="grid"></i> جميع المجالات</div>
                        <i data-lucide="chevron-down" style="width: 18px; color: #94A3B8;"></i>
                    </div>
                    <div class="elite-dropdown-menu">
                        <div class="elite-dropdown-option active" data-value="" data-i18n="all_specialties"><i data-lucide="grid"></i> جميع المجالات</div>
                        <div class="elite-dropdown-option" data-value="electricity" data-i18n="electricity"><i data-lucide="zap"></i> الكهرباء</div>
                        <div class="elite-dropdown-option" data-value="plumbing" data-i18n="plumbing"><i data-lucide="droplets"></i> السباكة</div>
                        <div class="elite-dropdown-option" data-value="carpentry" data-i18n="carpentry"><i data-lucide="hammer"></i> النجارة</div>
                        <div class="elite-dropdown-option" data-value="painting" data-i18n="painting"><i data-lucide="palette"></i> الصباغة</div>
                        <div class="elite-dropdown-option" data-value="masonry" data-i18n="masonry"><i data-lucide="brick-wall"></i> البناء</div>
                        <div class="elite-dropdown-option" data-value="ac" data-i18n="ac"><i data-lucide="wind"></i> التكييف</div>
                        <div class="elite-dropdown-option" data-value="aluminum" data-i18n="aluminum"><i data-lucide="door-open"></i> الألمنيوم</div>
                        <div class="elite-dropdown-option" data-value="cleaning" data-i18n="cleaning"><i data-lucide="sparkles"></i> التنظيف</div>
                        <div class="elite-dropdown-option" data-value="appliances" data-i18n="appliances"><i data-lucide="monitor"></i> إلكترومنزلي</div>
                        <div class="elite-dropdown-option" data-value="transport" data-i18n="transport"><i data-lucide="truck"></i> النقل</div>
                    </div>
                    <input type="hidden" id="catSelect" value="">
                </div>
            </div>
            <div class="filter-col">
                <label class="dock-label"><i data-lucide="map-pin"></i> <span data-i18n="city">المدينة</span></label>
                <div class="elite-dropdown" id="cityDropdown">
                    <div class="elite-dropdown-trigger">
                        <div class="selected-label" data-i18n="all_cities"><i data-lucide="map"></i> كل المغرب</div>
                        <i data-lucide="chevron-down" style="width: 18px; color: #94A3B8;"></i>
                    </div>
                    <div class="elite-dropdown-menu">
                        <div class="elite-dropdown-option active" data-value="" data-i18n="all_cities"><i data-lucide="map"></i> كل المغرب</div>
                        <div class="elite-dropdown-option" data-value="taroudant" data-i18n="taroudant"><i data-lucide="navigation"></i> تارودانت</div>
                        <div class="elite-dropdown-option" data-value="agadir" data-i18n="agadir"><i data-lucide="navigation"></i> أكادير</div>
                        <div class="elite-dropdown-option" data-value="marrakech" data-i18n="marrakech"><i data-lucide="navigation"></i> مراكش</div>
                    </div>
                    <input type="hidden" id="citySelect" value="">
                </div>
            </div>
            <button class="btn-elite-v4 btn-book-now" style="width: 160px;" onclick="handleFilter()">
                <i data-lucide="sliders-horizontal" style="width: 20px;"></i> <span data-i18n="filter_now">تصفية</span>
            </button>
        </div>

        <!-- Artisan Results Section -->
        <section class="section" style="padding-top: 60px; padding-bottom: 120px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <div style="width: 8px; height: 35px; background: var(--primary-red); border-radius: 4px;"></div>
                    <h2 style="font-weight: 950; font-size: 28px; color: #0F172A;" id="statusLabel" data-i18n="results_ready">المحترفون المتاحون</h2>
                </div>
                <div style="background: #F1F5F9; padding: 8px 18px; border-radius: 100px; font-weight: 900; color: #475569; font-size: 14px;" id="resCount">0 حرفي</div>
            </div>

            <div class="artisan-grid-v3" id="artisanGrid"
                style="display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 30px;">
                <!-- Cards injected here -->
            </div>
        </section>
    </main>

    <div class="footer-container"></div>

    <script>
        function renderSkeleton() {
            const grid = document.getElementById('artisanGrid');
            grid.innerHTML = Array(6).fill(0).map(() => `
                <div class="artisan-card-elite" style="pointer-events: none; opacity: 0.7;">
                    <div class="card-profile-header">
                        <div class="skeleton" style="width: 90px; height: 90px; border-radius: 28px;"></div>
                        <div style="flex: 1;">
                            <div class="skeleton" style="width: 60%; height: 20px; margin-bottom: 10px;"></div>
                            <div class="skeleton" style="width: 40%; height: 15px;"></div>
                        </div>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <div class="skeleton" style="width: 80px; height: 35px; border-radius: 14px;"></div>
                        <div class="skeleton" style="width: 80px; height: 35px; border-radius: 14px;"></div>
                    </div>
                    <div class="skeleton" style="width: 100%; height: 40px;"></div>
                    <div class="skeleton" style="width: 100%; height: 80px; border-radius: 25px;"></div>
                    <div style="display: grid; grid-template-columns: 1fr 1.5fr; gap: 15px;">
                        <div class="skeleton" style="height: 58px; border-radius: 18px;"></div>
                        <div class="skeleton" style="height: 58px; border-radius: 18px;"></div>
                    </div>
                </div>
            `).join('');
        }

        function renderArtisans(data) {
            const container = document.getElementById('artisanGrid');
            const count = document.getElementById('resCount');
            
            // Sort Elite first
            const list = [...data].sort((a, b) => (b.isElite ? 1 : 0) - (a.isElite ? 1 : 0));
            
            count.innerText = window.api?.backendConfigured === false ? 'بانتظار البيانات' : `${list.length} حرفي`;

            if (list.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 100px 20px;">
                    <i data-lucide="search-x" style="width: 80px; height: 80px; color: #CBD5E1; margin-bottom: 20px;"></i>
                    <h3 style="font-size: 24px; color: #64748B;">${window.api?.backendConfigured === false ? 'ستظهر ملفات الحرفيين بعد ربط قاعدة البيانات.' : 'لم نجد أي نتائج تطابق بحثك.'}</h3>
                </div>`;
                if (window.lucide) lucide.createIcons();
                return;
            }

            container.innerHTML = list.map(a => `
                <div class="artisan-card-elite">
                    ${a.verified ? `<div class="card-badge-verified"><i data-lucide="check-circle" style="width:14px;"></i> ${t('verified') || 'موثق'}</div>` : ''}
                    ${a.isElite ? `<div class="card-badge-elite"><i data-lucide="crown" style="width:14px;"></i> Elite</div>` : ''}
                    
                    <div class="card-profile-header">
                        <div class="card-avatar-wrapper">
                            <img src="${a.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(a.name)}&background=random`}" class="card-avatar-v3" alt="${a.name}">
                            ${a.available === true ? '<div class="online-dot"></div>' : ''}
                        </div>
                        <div class="card-name-v3">
                            <h3>${a.name}</h3>
                            ${Number.isFinite(Number(a.rating)) && Number(a.rating) > 0 ? `<div class="card-star-chip"><i data-lucide="star" style="width:16px; fill:#D97706;"></i><span>${a.rating}${Number.isFinite(Number(a.reviews)) ? ` (${a.reviews})` : ''}</span></div>` : ''}
                        </div>
                    </div>

                    <div class="card-tag-cloud">
                        <div class="tag-v3"><i data-lucide="wrench" style="width:16px;"></i> ${t(a.category) || a.category}</div>
                        <div class="tag-v3"><i data-lucide="map-pin" style="width:16px;"></i> ${t(a.city) || a.city}</div>
                    </div>

                    <p class="card-bio-v3">${a.bio || 'لا توجد نبذة متاحة.'}</p>

                    <div class="card-metrics-v3">
                        <div class="metric-v3">
                            <span class="m-val">${Number.isFinite(Number(a.exp)) && a.exp !== '' ? `${a.exp}+` : '--'}</span>
                            <span class="m-lab">${t('years_exp_suffix') || 'سنة خبرة'}</span>
                        </div>
                        <div class="metric-v3">
                            <span class="m-val" style="color:${a.available === true ? '#10B981' : '#94A3B8'};">${a.available === true ? '<i data-lucide="check-circle" style="width:20px;"></i>' : '--'}</span>
                            <span class="m-lab">${a.available === true ? (t('available') || 'متاح') : 'التوفر غير محدد'}</span>
                        </div>
                    </div>

                    <div class="card-btn-group">
                        <a href="artisan-profile.html?id=${encodeURIComponent(a.id)}&contact=1" class="btn-elite-v4 btn-book-now">
                            <i data-lucide="message-circle"></i>
                            <span>تواصل داخل المنصة</span>
                        </a>
                        <a href="artisan-profile.html?id=${encodeURIComponent(a.id)}" class="btn-elite-v4 btn-view-profile">
                            <i data-lucide="user"></i>
                            <span>${t('profile') || 'الملف الشخصي'}</span>
                        </a>
                    </div>
                </div>
            `).join('');
            if (window.lucide) lucide.createIcons();
        }

        function initEliteDropdowns() {
            document.querySelectorAll('.elite-dropdown').forEach(dropdown => {
                const trigger = dropdown.querySelector('.elite-dropdown-trigger');
                const menu = dropdown.querySelector('.elite-dropdown-menu');
                const options = dropdown.querySelectorAll('.elite-dropdown-option');
                const label = dropdown.querySelector('.selected-label');
                const input = dropdown.querySelector('input[type="hidden"]');

                trigger.addEventListener('click', (e) => {
                    e.stopPropagation();
                    // Close other dropdowns
                    document.querySelectorAll('.elite-dropdown').forEach(d => {
                        if (d !== dropdown) d.classList.remove('active');
                    });
                    dropdown.classList.toggle('active');
                });

                options.forEach(opt => {
                    opt.addEventListener('click', () => {
                        const val = opt.dataset.value;
                        const html = opt.innerHTML;
                        
                        label.innerHTML = html;
                        // Copy i18n attribute if exists
                        if (opt.dataset.i18n) label.dataset.i18n = opt.dataset.i18n;
                        
                        input.value = val;

                        options.forEach(o => o.classList.remove('active'));
                        opt.classList.add('active');
                        dropdown.classList.remove('active');

                        handleFilter();
                        if (window.lucide) lucide.createIcons();
                    });
                });
            });

            document.addEventListener('click', () => {
                document.querySelectorAll('.elite-dropdown').forEach(d => d.classList.remove('active'));
            });
        }

        async function handleFilter() {
            const q = document.getElementById('qSearch').value;
            const cat = document.getElementById('catSelect').value;
            const city = document.getElementById('citySelect').value;

            renderSkeleton();

            try {
                const res = await api.getArtisans({ q, category: cat, city });
                if (res.success) {
                    renderArtisans(res.data);
                } else {
                    renderArtisans([]);
                }
            } catch (err) {
                console.error(err);
                renderArtisans([]);
            }
        }

        window.onload = async () => {
            initEliteDropdowns();
            
            const params = new URLSearchParams(window.location.search);
            const cat = params.get('category');
            const city = params.get('city');

            if (cat) {
                const opt = document.querySelector(`#catDropdown [data-value="${cat}"]`);
                if (opt) opt.click();
            }
            if (city) {
                const opt = document.querySelector(`#cityDropdown [data-value="${city}"]`);
                if (opt) opt.click();
            }

            if (!cat && !city) await handleFilter();
            
            if (window.I18nManager) I18nManager.updateDOM();
        };
    </script>
    <script src="platform-actions.js"></script>
</body>

</html>
