<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر المعدات | lharfa.ma</title>
    <link rel="icon" type="image/jpeg" href="logo1.png">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@0.344.0"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="translations.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="api.js"></script>
    <script src="i18n-manager.js"></script>
    <script src="navbar.js" defer></script>
    <script src="footer.js" defer></script>
    <style>
        :root {
            --shop-bg: #020617;
            --card-bg: #0B1120;
            --primary-red: #FF3F00;
            --primary-green: #10B981;
            --primary-orange: #FF3F00;
        }

        body {
            background-color: var(--shop-bg);
            font-family: 'Tajawal', sans-serif;
            color: white;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .shop-page-header {
            padding: 120px 0 100px;
            text-align: center;
            background: radial-gradient(circle at top, rgba(255, 63, 0, 0.1), transparent);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            padding-bottom: 150px;
            min-height: 400px;
        }

        .tool-card-premium {
            background: var(--card-bg);
            border-radius: 40px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            transition: 0.3s;
        }
        .tool-card-premium:hover { transform: translateY(-10px); border-color: var(--primary-orange); }
        .tool-card-premium { cursor: pointer; }
        .product-detail-hint { color: rgba(255,255,255,0.55); font-size: 12px; font-weight: 800; text-align: center; margin: -8px 0 12px; }

        .image-box {
            background: white;
            height: 320px;
            margin: 12px;
            border-radius: 35px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        .image-box img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .content-box { padding: 20px 30px 30px; flex: 1; display: flex; flex-direction: column; }
        .product-title { font-size: 22px; font-weight: 950; margin: 0 0 20px; text-align: center; height: 60px; display: flex; align-items: center; justify-content: center; }
        .main-price { font-weight: 950; font-size: 38px; display: flex; align-items: baseline; gap: 8px; }
        .add-btn { flex: 1; height: 65px; border-radius: 20px; background: #2563EB; color: white; border: none; font-weight: 950; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }

        .cart-trigger { position: fixed; bottom: 120px; left: 30px; width: 75px; height: 75px; background: var(--primary-orange); color: white; border-radius: 25px; display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 40px rgba(255, 63, 0, 0.4); border: none; cursor: pointer; z-index: 999; }
        .cart-badge { position: absolute; top: -10px; right: -10px; background: white; color: #FF3F00; width: 32px; height: 32px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 950; border: 3px solid var(--primary-orange); }

        .cart-drawer { position: fixed; top: 0; right: -100%; width: 450px; height: 100vh; background: #0B1120; z-index: 10000; transition: 0.5s; display: flex; flex-direction: column; }
        .cart-drawer.active { right: 0; }
        .cart-footer { padding: 30px; background: rgba(255,255,255,0.02); border-top: 1px solid rgba(255,255,255,0.05); }

        .checkout-btn { width: 100%; height: 70px; background: var(--primary-green); color: white; border-radius: 20px; font-weight: 950; font-size: 18px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; }
    
        /* Professional shop responsive layer */
        .shop-page-header h1 { letter-spacing: 0; }
        .shop-page-header p { max-width: 680px; margin: 0 auto; line-height: 1.7; }
        .tool-card-premium { box-shadow: 0 22px 55px rgba(0, 0, 0, 0.22); }
        .tool-card-premium:hover .image-box img { transform: scale(1.05); }
        .image-box img { transition: 0.35s ease; }
        .add-btn:hover, .checkout-btn:hover, .cart-trigger:hover { filter: brightness(1.08); }

        @media (max-width: 768px) {
            body { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)) !important; }
            .shop-page-header {
                padding: 70px 0 32px !important;
                background: radial-gradient(circle at 50% 0%, rgba(255, 63, 0, 0.18), transparent 44%), linear-gradient(180deg, #07101f 0%, #020617 100%) !important;
            }
            .shop-page-header .container { padding-inline: 16px !important; }
            .shop-page-header h1 { font-size: clamp(28px, 8vw, 36px) !important; line-height: 1.18 !important; margin-bottom: 10px !important; }
            .shop-page-header p { font-size: 14px !important; opacity: 0.72 !important; max-width: 310px !important; }
            main.container { padding-inline: 12px !important; }
            .product-grid {
                display: grid !important;
                grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
                gap: 10px !important;
                padding-bottom: 120px !important;
                min-height: 240px !important;
            }
            .tool-card-premium {
                border-radius: 18px !important;
                min-width: 0 !important;
                background: linear-gradient(180deg, #101827 0%, #08111f 100%) !important;
                border-color: rgba(255, 255, 255, 0.08) !important;
                box-shadow: 0 14px 34px rgba(0, 0, 0, 0.22) !important;
            }
            .image-box { height: 118px !important; margin: 7px !important; padding: 18px !important; border-radius: 14px !important; }
            .content-box { padding: 8px 9px 10px !important; }
            .content-box > div:first-child { align-items: center !important; gap: 6px !important; margin-bottom: 6px !important; }
            .content-box > div:first-child span {
                font-size: 9px !important;
                line-height: 1.2 !important;
                max-width: 50% !important;
                overflow: hidden !important;
                text-overflow: ellipsis !important;
                white-space: nowrap !important;
            }
            .product-title {
                height: 44px !important;
                font-size: 12px !important;
                line-height: 1.35 !important;
                margin-bottom: 8px !important;
                display: -webkit-box !important;
                -webkit-line-clamp: 2 !important;
                -webkit-box-orient: vertical !important;
                overflow: hidden !important;
            }
            .content-box > div:nth-of-type(2) {
                flex-direction: column !important;
                align-items: stretch !important;
                gap: 6px !important;
                margin-bottom: 10px !important;
                text-align: center !important;
            }
            .content-box > div:nth-of-type(2) > div:first-child { order: 2 !important; }
            .main-price { order: 1 !important; justify-content: center !important; font-size: 19px !important; line-height: 1 !important; gap: 4px !important; }
            .add-btn {
                width: 100% !important;
                height: 42px !important;
                min-height: 42px !important;
                border-radius: 13px !important;
                font-size: 12px !important;
                gap: 6px !important;
                background: linear-gradient(135deg, #FF3F00, #E53600) !important;
            }
            .add-btn i { width: 16px !important; height: 16px !important; }
            .cart-trigger {
                width: 58px !important;
                height: 58px !important;
                left: 14px !important;
                bottom: calc(92px + env(safe-area-inset-bottom, 0px)) !important;
                border-radius: 18px !important;
                z-index: 29999 !important;
            }
            .cart-trigger i { width: 24px !important; height: 24px !important; }
            .cart-badge {
                width: 25px !important;
                height: 25px !important;
                border-radius: 9px !important;
                font-size: 12px !important;
                border-width: 2px !important;
                top: -7px !important;
                right: -7px !important;
            }
            .cart-drawer { width: 100vw !important; max-width: 100vw !important; right: -100vw !important; border-radius: 0 !important; z-index: 40000 !important; }
            .cart-drawer.active { right: 0 !important; }
            .cart-drawer > div:first-child { padding: 22px 18px !important; }
            .cart-drawer h2 { font-size: 22px !important; }
            #cartItemsList { padding: 16px !important; }
            .cart-footer { padding: 16px !important; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)) !important; }
            .checkout-btn { height: 54px !important; border-radius: 16px !important; font-size: 15px !important; }
        }

        @media (max-width: 360px) {
            .product-grid { grid-template-columns: 1fr !important; }
            .image-box { height: 160px !important; }
        }</style>
    <link rel="stylesheet" href="mobile.css">
</head>

<body>
    <nav class="navbar"></nav>

    <header class="shop-page-header">
        <div class="container">
            <h1 style="font-weight: 950; margin-bottom: 15px; font-size: 42px;">متجر المعدات الاحترافي</h1>
            <p style="opacity: 0.6; font-weight: 700; font-size: 18px;">أفضل الماركات العالمية بأثمنة خاصة للحرفيين</p>
        </div>
    </header>

    <main class="container">
        <div class="product-grid" id="toolsGrid">
            <!-- Loading State -->
            <div style="grid-column: 1/-1; text-align: center; padding: 100px;">
                <p style="font-weight: 800; opacity: 0.5;">جاري تحميل المنتجات...</p>
            </div>
        </div>
    </main>

    <div class="cart-drawer" id="cartDrawer">
        <div style="padding: 40px 30px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center;">
            <h2 style="font-weight: 950; margin: 0;">سلة المشتريات</h2>
            <button onclick="toggleCart()" style="background: none; border: none; color: white; cursor: pointer;"><i data-lucide="x"></i></button>
        </div>
        <div id="cartItemsList" style="flex: 1; overflow-y: auto; padding: 30px;"></div>
        <div class="cart-footer">
            <div style="display: flex; justify-content: space-between; margin-bottom: 25px; font-size: 22px; font-weight: 950;">
                <span>المجموع</span>
                <span id="cartTotalPrice">0 DH</span>
            </div>
            <button class="checkout-btn" onclick="checkoutToAdmin()">تأكيد الطلبية <i data-lucide="check-circle"></i></button>
        </div>
    </div>

    <button class="cart-trigger" id="cartBtn" onclick="toggleCart()">
        <i data-lucide="shopping-bag" style="width: 32px; height: 32px;"></i>
        <span class="cart-badge" id="cartBadgeCount">0</span>
    </button>

    <div class="footer-container"></div>

    <script>
        let allTools = [];
        let cart = JSON.parse(localStorage.getItem('albane_cart') || '[]');

        async function initShop() {
            try {
                const res = await api.getTools();
                if (res.success && res.data.length > 0) {
                    allTools = res.data;
                    renderTools(allTools);
                    updateCartUI();
                } else {
                    document.getElementById('toolsGrid').innerHTML = `
                        <div style="grid-column: 1/-1; text-align: center; padding: 100px;">
                            <p style="font-weight: 800; opacity: 0.5;">${window.api?.backendConfigured === false ? 'ستظهر المنتجات بعد ربط قاعدة البيانات.' : 'لا توجد منتجات متوفرة حالياً.'}</p>
                        </div>
                    `;
                }
            } catch (err) {
                console.error("Shop init error:", err);
                document.getElementById('toolsGrid').innerHTML = `<p style="text-align:center; padding:50px;">عذراً، حدث خطأ أثناء تحميل البيانات.</p>`;
            }
        }

        function renderTools(data) {
            const grid = document.getElementById('toolsGrid');
            grid.innerHTML = data.map(tool => `
                <div class="tool-card-premium" onclick="openProductDetail(${tool.id})" role="link" tabindex="0" onkeydown="handleProductCardKey(event, ${tool.id})">
                    <div class="image-box">
                        <img src="${tool.image}" alt="${tool.name}">
                    </div>
                    <div class="content-box">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                            <span style="color:var(--primary-red); font-weight:950; font-size:12px;">${tool.brand ? tool.brand.toUpperCase() : ''}</span>
                        </div>
                        <h3 class="product-title">${tool.name}</h3>
                        <div class="product-detail-hint">عرض التفاصيل</div>
                        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 25px;">
                            <div>
                                <div style="color:var(--primary-green); font-weight:950; font-size:13px;">ثمن الحرفي</div>
                            </div>
                            <div class="main-price">DH ${tool.price}</div>
                        </div>
                        <button class="add-btn" onclick="event.stopPropagation(); addToCart(${tool.id})">إضافة <i data-lucide="plus"></i></button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function openProductDetail(id) {
            window.location.href = `product-detail.html?id=${id}`;
        }

        function handleProductCardKey(event, id) {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                openProductDetail(id);
            }
        }

        function toggleCart() { document.getElementById('cartDrawer').classList.toggle('active'); }

        function addToCart(id) {
            const tool = allTools.find(t => t.id === id);
            if (tool) {
                cart.push({...tool, cartId: Date.now()});
                localStorage.setItem('albane_cart', JSON.stringify(cart));
                updateCartUI();
                if (!document.getElementById('cartDrawer').classList.contains('active')) toggleCart();
            }
        }

        function removeFromCart(cartId) {
            cart = cart.filter(item => item.cartId !== cartId);
            localStorage.setItem('albane_cart', JSON.stringify(cart));
            updateCartUI();
        }

        function updateCartUI() {
            const list = document.getElementById('cartItemsList');
            const total = document.getElementById('cartTotalPrice');
            const badge = document.getElementById('cartBadgeCount');
            badge.textContent = cart.length;
            if (cart.length === 0) {
                list.innerHTML = `<p style="text-align:center; opacity:0.5; padding:50px;">السلة فارغة</p>`;
                total.textContent = '0 DH';
            } else {
                list.innerHTML = cart.map(item => `
                    <div style="display: flex; gap: 15px; background: rgba(255,255,255,0.03); padding: 15px; border-radius: 20px; margin-bottom: 15px; align-items: center;">
                        <img src="${item.image}" style="width: 50px; height: 50px; border-radius: 10px; background: white; padding: 5px; object-fit: contain;">
                        <div style="flex: 1;"><div style="font-weight: 800; font-size: 14px;">${item.name}</div><div style="font-weight: 950; color: #10B981;">${item.price} DH</div></div>
                        <button onclick="removeFromCart(${item.cartId})" style="background: none; border: none; color: #ff4d4d; cursor: pointer;"><i data-lucide="trash-2"></i></button>
                    </div>
                `).join('');
                total.textContent = `${cart.reduce((acc, item) => acc + item.price, 0)} DH`;
            }
            lucide.createIcons();
        }

        async function checkoutToAdmin() {
            if (cart.length === 0) return;
            const user = JSON.parse(localStorage.getItem('albane_user') || '{}');
            const order = { id: Date.now(), user: user.name || 'مجهول', phone: user.phone || '0xxx', city: user.city || 'تارودانت', total: cart.reduce((a, b) => a + b.price, 0), date: new Date().toISOString(), status: 'pending', items: cart };
            const orders = JSON.parse(localStorage.getItem('albane_shop_orders') || '[]');
            orders.unshift(order);
            localStorage.setItem('albane_shop_orders', JSON.stringify(orders));
            cart = []; localStorage.setItem('albane_cart', '[]');
            updateCartUI(); toggleCart();
            alert('تم إرسال الطلب بنجاح!');
        }

        window.onload = initShop;
    </script>
    <script src="platform-actions.js"></script>
</body>
</html>
